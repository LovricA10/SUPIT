<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./CSS/global.css" />
    <link rel="stylesheet" href="./CSS/curriculum.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <title>Curriculum</title>
  </head>
  <body>
    <header class="header-section">
      <nav class="nav-bar">
        <div id="hamburger-menu">
          <img src="./icons/Menu.svg" alt="hamburger menu" />
        </div>
        <ul class="main-list">
          <li id="login">
            <a href="form.html"
              >Prijavi se <img src="./icons/Login.svg" alt="login"
            /></a>
          </li>
          <li id="logout">
            <a href="index.html"
              >Odjavi se <img src="./icons/Login.svg" alt="login"
            /></a>
          </li>
          <li>
            <a href="index.html"
              >Početna <img src="./icons/Home.svg" alt="home"
            /></a>
          </li>
          <li>
            <a href="about.html"
              >O nama <img src="./icons/About us.svg" alt="about-us"
            /></a>
          </li>
          <li>
            <a href="news.html"
              >Novosti <img src="./icons/News.svg" alt="news"
            /></a>
          </li>
          <li id="study-program">
            <a href="curriculum.html"
              >Nastavni plan <img src="./icons/Curriculum.svg" alt="Info"
            /></a>
          </li>
          <li>
            <a href="#contact-overlay"
              >Kontakt <img src="./icons/Contact.svg" alt="contact"
            /></a>
          </li>
        </ul>
      </nav>
    </header>

    <div id="contact-overlay" class="overlay">
      <div class="overlay-content">
        <a href="#" class="close-overlay">&times;</a>
        <iframe
          src="contact.html"
          frameborder="0"
          class="contact-iframe"
        ></iframe>
      </div>
    </div>

    <main id="main-content">
      <section id="curriculum-section">
        <div class="about-us">
          <h2>Nastavni plan</h2>
          <div class="yellow-line"></div>
        </div>

        <div id="flex-container">
          <form action="" method="get" id="search-form">
            <div class="search-parameters">
              <label id="curriculum-label">Naziv kolegija:</label>
              <input
                type="text"
                name="query"
                placeholder="Search"
                id="search-input"
                autocomplete="off"
                list="subject"
              />
              <datalist id="subject">
                <!-- Options will be dynamically populated -->
              </datalist>
            </div>
          </form>
          <div id="table-container">
            <table id="selected-curriculum-table">
              <thead>
                <tr>
                  <th>Kolegij</th>
                  <th>ECTS</th>
                  <th>Sati</th>
                  <th>Predavanja</th>
                  <th>Vježbe</th>
                  <th>Tip</th>
                  <th>Akcija</th>
                </tr>
              </thead>
              <tbody></tbody>
              <tfoot>
                <!-- This will contain the totals row -->
              </tfoot>
            </table>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-of-page">
        <h2 id="first">Budi izvrstan u onom što voliš</h2>
        <h2 id="second">Zaiskri</h2>
      </div>
    </footer>

    <script src="./JS/Curriculum.js"></script>
    <script src="./JS/Global.js"></script>
  </body>
</html>
