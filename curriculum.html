<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./CSS/global.css" />
    <link rel="stylesheet" href="./CSS/curriculum.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <title>Curriculum</title>
  </head>
  <body>
    <header class="header-section">
      <nav class="nav-bar">
        <ul class="main-list">
          <li id="login">
            <a href="form.html"
              >Prijavi se <img src="./icons/Login.svg" alt="login"
            /></a>
          </li>
          <li id="logout">
            <a href="index.html"
              >Odjavi se <img src="./icons/Login.svg" alt="login"
            /></a>
          </li>
          <li>
            <a href="index.html"
              >Početna <img src="./icons/Home.svg" alt="home"
            /></a>
          </li>
          <li>
            <a href="about.html"
              >O nama <img src="./icons/About us.svg" alt="about-us"
            /></a>
          </li>
          <li>
            <a href="news.html"
              >Novosti <img src="./icons/News.svg" alt="news"
            /></a>
          </li>
          <li id="study-program">
            <a href="curriculum.html"
              >Nastavni plan <img src="./icons/Curriculum.svg" alt="Info"
            /></a>
          </li>
          <li>
            <a href="#contact-overlay"
              >Kontakt <img src="./icons/Contact.svg" alt="contact"
            /></a>
          </li>
        </ul>
      </nav>
    </header>

    <div id="contact-overlay" class="overlay">
      <div class="overlay-content">
        <a href="#" class="close-overlay">&times;</a>
        <iframe
          src="contact.html"
          frameborder="0"
          class="contact-iframe"
        ></iframe>
      </div>
    </div>

    <section id="curriculum-section">
      <div class="about-us">
        <h2>Nastavni plan</h2>
        <div class="yellow-line"></div>
      </div>

      <form action="" method="get" id="search-form">
        <div class="search-parameters">
          <label id="curriculum-label">Naziv kolegija:</label>
          <input
            type="text"
            name="query"
            placeholder="Search"
            id="search-input"
            autocomplete="off"
            list="subject"
          />
        </div>
        <datalist id="subject"> </datalist>
      </form>
      <ul
        id="autocomplete-results"
        class="autocomplete-results"
        style="display: none"
      ></ul>
      <div id="curriculum-details">
        <table id="selected-curriculum-table">
          <thead>
            <tr>
              <th>Kolegij</th>
              <th>ECTS</th>
              <th>Sati</th>
              <th>Predavanja</th>
              <th>Vježbe</th>
              <th>Tip</th>
              <th>Delete</th>
            </tr>
          </thead>
          <tbody>
            <!-- Details will be appended here -->
          </tbody>
        </table>
        <div id="total-info">
          <p id="total-ects">Ukupno ECTS: 0</p>
          <p id="total-hours">Ukupno Sati: 0</p>
        </div>
      </div>
    </section>

    <footer>
      <div class="footer-of-page">
        <h2 id="first">Budi izvrstan u onom što voliš</h2>
        <h2 id="second">Zaiskri</h2>
      </div>
    </footer>

    <script src="./JS/Curriculum.js"></script>
    <script src="./JS/Global.js"></script>
  </body>
</html>
